# Pocket-Web-Studio — build the installers on GitHub.
#
# Every push and pull request runs the tests only.
# To build the installers, push a version tag (for example v2.2.0), or press
# "Run workflow" on the Actions tab. The Windows, Linux and macOS installers are
# then attached to a GitHub Release. Nothing is uploaded as an Actions artifact.
name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  installers:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis          # Setup .exe installer
            files: dist/*.exe
          - os: ubuntu-latest
            target: --linux AppImage deb
            files: |
              dist/*.AppImage
              dist/*.deb
          - os: macos-latest
            target: --mac dmg
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no code-signing certificate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Build installers
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Work out the release name
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Pocket-Web-Studio ${{ steps.tag.outputs.name }}
          files: ${{ matrix.files }}
          fail_on_unmatched_files: true
